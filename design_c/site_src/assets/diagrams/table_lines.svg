<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="tableTitle tableDesc">
  <title id="tableTitle">Two running lines on a club table</title>
  <desc id="tableDesc">A schematic plan of one rectangular table. Town, stories, and other builds sit above two parallel track lines that run the full width. Not a member build and not to scale.</desc>
  <g id="plate-shadow">
    <rect x="36" y="36" width="648" height="312" fill="#164468" />
  </g>
  <g id="plate">
    <rect x="20" y="20" width="648" height="312" fill="#ffffff" stroke="#102033" stroke-width="3" />
  </g>
  <g id="edge-studs" fill="#2768A5">
    <circle cx="52" cy="44" r="7" />
    <circle cx="84" cy="44" r="7" />
    <circle cx="116" cy="44" r="7" />
    <circle cx="148" cy="44" r="7" />
    <circle cx="180" cy="44" r="7" />
    <circle cx="212" cy="44" r="7" />
    <circle cx="244" cy="44" r="7" />
    <circle cx="276" cy="44" r="7" />
    <circle cx="308" cy="44" r="7" />
    <circle cx="340" cy="44" r="7" />
    <circle cx="372" cy="44" r="7" />
    <circle cx="404" cy="44" r="7" />
    <circle cx="436" cy="44" r="7" />
    <circle cx="468" cy="44" r="7" />
    <circle cx="500" cy="44" r="7" />
    <circle cx="532" cy="44" r="7" />
    <circle cx="564" cy="44" r="7" />
    <circle cx="596" cy="44" r="7" />
    <circle cx="628" cy="44" r="7" />
  </g>
  <g id="zone-dividers" fill="none" stroke="#102033" stroke-width="1.5">
    <line x1="236" y1="68" x2="236" y2="176" />
    <line x1="452" y1="68" x2="452" y2="176" />
  </g>
  <g id="zone-labels" fill="#102033" font-family="sans-serif" font-size="22">
    <text x="44" y="86">Town</text>
    <text x="256" y="86">Stories</text>
    <text x="472" y="86">Other builds</text>
  </g>
  <g id="town-blocks" fill="#1A4E7C">
    <rect x="48" y="108" width="36" height="52" />
    <rect x="92" y="124" width="48" height="36" />
    <rect x="148" y="100" width="28" height="60" />
  </g>
  <g id="story-blocks" fill="#2768A5">
    <rect x="268" y="128" width="70" height="32" />
    <polygon points="268,128 303,104 338,128" />
    <rect x="360" y="116" width="40" height="44" />
  </g>
  <g id="other-blocks" fill="#164468">
    <rect x="488" y="120" width="44" height="44" />
    <rect x="544" y="132" width="64" height="28" />
  </g>
  <g id="running-lines">
    <rect x="44" y="196" width="600" height="28" fill="#2768A5" />
    <rect x="44" y="240" width="600" height="28" fill="#1A4E7C" />
    <g id="ties" fill="#102033">
      <rect x="80" y="188" width="8" height="88" />
      <rect x="160" y="188" width="8" height="88" />
      <rect x="240" y="188" width="8" height="88" />
      <rect x="320" y="188" width="8" height="88" />
      <rect x="400" y="188" width="8" height="88" />
      <rect x="480" y="188" width="8" height="88" />
      <rect x="560" y="188" width="8" height="88" />
    </g>
    <rect x="44" y="196" width="600" height="28" fill="#2768A5" />
    <rect x="44" y="240" width="600" height="28" fill="#1A4E7C" />
  </g>
  <g id="line-labels" fill="#102033" font-family="sans-serif" font-size="16">
    <text x="44" y="300">Upper band: outer line. Lower band: inner line.</text>
  </g>
  <g id="abstract-car">
    <rect x="430" y="186" width="92" height="48" fill="#C91A09" />
    <rect x="454" y="174" width="40" height="18" fill="#C91A09" />
  </g>
  <g id="disclaimer" fill="#102033" font-family="sans-serif" font-size="16">
    <text x="20" y="372">Schematic. Not a member build. Not to scale.</text>
  </g>
</svg>
