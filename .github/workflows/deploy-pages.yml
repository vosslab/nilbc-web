name: Publish four website designs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
      # Enable Settings > Pages > GitHub Actions once before the first deployment.
      - name: Check GitHub Pages setup
        uses: actions/configure-pages@v6.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r pip_requirements.txt
      - name: Build comparison homepage and designs A-D
        run: source source_me.sh && python3 build_sites.py
        shell: bash
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify all designs under the GitHub Pages prefix
        run: node tests/playwright/designs_smoke.mjs
      - name: Upload the combined website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: output_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # ASVS 13.3.2: only deployment receives Pages write and OIDC permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the combined website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
