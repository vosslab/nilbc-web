# Club photo manifest.
# Every photo on the website comes from the public NILTC website (niltc.org) media library.
# devel/fetch_club_photos.py downloads source_url into data/photo_sources/;
# devel/build_site_assets.py writes WebP derivatives to site_src/assets/photos/.
# Fields: id (file stem), source_url, source_page, theme, credit, caption, alt.
# Captions describe only what is visible or stated on niltc.org; builders stay unnamed
# because niltc.org does not credit individual photos or models.
# Themes: trains, city, screen (film, TV, games), creatures (characters and critters),
# club (people and shows).

# the world name shown on photo captions and credits for each theme
themes:
  trains: Rail yards
  city: Cities and landmarks
  screen: Screen and story
  creatures: Creatures and characters
  club: The club

photos:
